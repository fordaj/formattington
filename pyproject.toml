[project]
name = "formattington"
dynamic = ["version"]
description = "One formatter interface for your entire project: a cross-platform, multi-language formatting orchestrator that delegates to existing formatters"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "fordaj", email = "6288298+fordaj@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
formattington = "formattington.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "formattington._version.__version__"}
 
[tool.black]
line-length = 200

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
