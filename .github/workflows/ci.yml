name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-formatting:
    name: Check Formatting
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macOS, labels: [self-hosted, macOS] }
          - { os: Windows, labels: [self-hosted, Windows] }
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: ./repo
    steps:
      # Clone the repo with mirror-clone when available; fall back to
      # git clone otherwise (or if mirror-clone fails). A full clone is
      # required for the git-tag-derived version checks.
      - name: Clone Repo
        # Job default is ./repo, but ./repo is created by this step.
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP:-/tmp}"
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          clone_dir="$GITHUB_WORKSPACE/repo"
          rm -rf "$clone_dir"
          mkdir -p "$clone_dir"
          if command -v mirror-clone >/dev/null 2>&1; then
            echo "using mirror-clone"
            mirror-clone --branch "$branch" \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$clone_dir" || {
                echo "mirror-clone failed; falling back to git clone"
                rm -rf "$clone_dir"
                mkdir -p "$clone_dir"
                git clone --branch "$branch" \
                  "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                  "$clone_dir"
              }
          else
            echo "mirror-clone not installed; using git clone"
            git clone --branch "$branch" \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$clone_dir"
          fi

      # The repository dogfoods itself: build formattington from source and
      # run it against the minimal CI config (.formattington.ci.json). The
      # repo's own .formattington.json lists many formatters that are not
      # installable in CI, so the check is scoped to the toolchain every
      # runner can provide.
      #
      # cache: false — the setup-go post-run cache step hangs indefinitely
      # on these persistent self-hosted runners.
      - uses: actions/setup-go@v6
        with:
          go-version-file: ./repo/go.mod
          cache: false

      - name: Build formattington
        run: CGO_ENABLED=0 go build -o bin/formattington ./cmd/formattington

      # goimports via `go install` (lands in $(go env GOPATH)/bin).
      # Pinned: @latest now requires go >= 1.26, newer than the go.mod
      # toolchain these runners provide.
      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@v0.30.0

      # node + pnpm for the PATH-only formatter CLIs (prettier).
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install prettier
        shell: bash
        run: |
          set -euo pipefail
          PNPM_HOME="$HOME/pnpm"
          mkdir -p "$PNPM_HOME"
          export PATH="$PNPM_HOME:$PATH"
          pnpm config set global-bin-dir "$PNPM_HOME"
          pnpm add --global prettier
          echo "$PNPM_HOME" >> "$GITHUB_PATH"

      # shfmt — pinned release, installed into a scratch bin dir.
      - name: Install shfmt
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/fmt-bin"
          mkdir -p "$bin_dir"
          case "$(uname -s)-$(uname -m)" in
            Darwin-x86_64)                 s=shfmt_v3.14.1_darwin_amd64 ;;
            Darwin-arm64)                  s=shfmt_v3.14.1_darwin_arm64 ;;
            Linux-x86_64)                  s=shfmt_v3.14.1_linux_amd64 ;;
            Linux-aarch64|Linux-arm64)     s=shfmt_v3.14.1_linux_arm64 ;;
            MINGW*-x86_64|MSYS*-x86_64|CYGWIN*-x86_64) s=shfmt_v3.14.1_windows_amd64.exe ;;
            MINGW*-aarch64|MSYS*-aarch64|CYGWIN*-aarch64|*arm64)   s=shfmt_v3.14.1_windows_amd64.exe ;;
            *) echo "unsupported platform: $(uname -s) $(uname -m)" >&2; exit 2 ;;
          esac
          curl -fsSL "https://github.com/mvdan/sh/releases/download/v3.14.1/$s" -o "$bin_dir/shfmt"
          chmod +x "$bin_dir/shfmt"
          echo "$bin_dir" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          go version
          prettier --version
          shfmt --version
          goimports -h 2>&1 | head -1 || true

      - name: Run formattington format check
        run: ./bin/formattington --check --config .formattington.ci.json all

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macOS, labels: [self-hosted, macOS] }
          - { os: Windows, labels: [self-hosted, Windows] }
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: ./repo
    steps:
      # Clone the repo with mirror-clone when available; fall back to
      # git clone otherwise (or if mirror-clone fails). A full clone is
      # required for the git-tag-derived version checks.
      - name: Clone Repo
        # Job default is ./repo, but ./repo is created by this step.
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP:-/tmp}"
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          clone_dir="$GITHUB_WORKSPACE/repo"
          rm -rf "$clone_dir"
          mkdir -p "$clone_dir"
          if command -v mirror-clone >/dev/null 2>&1; then
            echo "using mirror-clone"
            mirror-clone --branch "$branch" \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$clone_dir" || {
                echo "mirror-clone failed; falling back to git clone"
                rm -rf "$clone_dir"
                mkdir -p "$clone_dir"
                git clone --branch "$branch" \
                  "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                  "$clone_dir"
              }
          else
            echo "mirror-clone not installed; using git clone"
            git clone --branch "$branch" \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$clone_dir"
          fi
      # cache: false — the setup-go post-run cache step hangs indefinitely
      # on these persistent self-hosted runners.
      - uses: actions/setup-go@v6
        with:
          go-version-file: ./repo/go.mod
          cache: false
      - run: go vet ./...
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      # The Windows suite cannot run as-is: the test harness relies on
      # #!/bin/sh fake executables that cannot be executed or resolved on
      # Windows (https://github.com/fordaj/formattington/issues/154).
      # Windows therefore runs build + vet + gofmt only until the harness
      # is fixed; macOS runs the full suite. The dotnet-format round trip
      # additionally probes the tool and skips when it is not usable
      # (https://github.com/fordaj/formattington/issues/155).
      - name: Test (macOS)
        if: matrix.os == 'macOS'
        run: go test ./...
      - run: go build ./...
